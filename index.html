<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Completa</title>
    <style>
        /* Estilos CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #333;
        }

        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            margin: 5px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
<style id="lf-tema">html,body{background:#000000 !important;color:#f2f2f2 !important;font-family:ui-monospace,Menlo,Consolas,monospace !important;font-size:19px !important}</style></head>
<body>
    <div class="container">
        <h1>Calculadora Completa</h1>
        
        <div class="calculator">
            <h2>Cálculos Generales</h2>
            <input type="number" id="input1" placeholder="Número 1">
            <input type="number" id="input2" placeholder="Número 2">
            <button onclick="sumar()">Sumar</button>
            <button onclick="restar()">Restar</button>
            <button onclick="multiplicar()">Multiplicar</button>
            <button onclick="dividir()">Dividir</button>
            <h3>Resultado: <span id="resultado"></span></h3>
        </div>

        <div class="physics-calculator">
            <h2>Cálculos de Física</h2>
            <input type="number" id="masa" placeholder="Masa (kg)">
            <input type="number" id="aceleracion" placeholder="Aceleración (m/s²)">
            <button onclick="calcularFuerza()">Calcular Fuerza</button>
            <h3>Fuerza: <span id="fuerza"></span> N</h3>
        </div>

        <div class="solar-calculator">
            <h2>Instalación de Paneles Solares</h2>
            <input type="number" id="potencia" placeholder="Potencia (W)">
            <input type="number" id="horas" placeholder="Horas de Sol">
            <button onclick="calcularEnergiaSolar()">Calcular Energía Solar</button>
            <h3>Energía Solar: <span id="energiaSolar"></span> Wh</h3>
        </div>
    </div>

    <script>
        // Funciones de JavaScript
        function sumar() {
            const num1 = parseFloat(document.getElementById('input1').value);
            const num2 = parseFloat(document.getElementById('input2').value);
            document.getElementById('resultado').innerText = num1 + num2;
        }

        function restar() {
            const num1 = parseFloat(document.getElementById('input1').value);
            const num2 = parseFloat(document.getElementById('input2').value);
            document.getElementById('resultado').innerText = num1 - num2;
        }

        function multiplicar() {
            const num1 = parseFloat(document.getElementById('input1').value);
            const num2 = parseFloat(document.getElementById('input2').value);
            document.getElementById('resultado').innerText = num1 * num2;
        }

        function dividir() {
            const num1 = parseFloat(document.getElementById('input1').value);
            const num2 = parseFloat(document.getElementById('input2').value);
            if (num2 !== 0) {
                document.getElementById('resultado').innerText = num1 / num2;
            } else {
                document.getElementById('resultado').innerText = 'Error: División por cero';
            }
        }

        function calcularFuerza() {
            const masa = parseFloat(document.getElementById('masa').value);
            const aceleracion = parseFloat(document.getElementById('aceleracion').value);
            const fuerza = masa * aceleracion;
            document.getElementById('fuerza').innerText = fuerza;
        }

        function calcularEnergiaSolar() {
            const potencia = parseFloat(document.getElementById('potencia').value);
            const horas = parseFloat(document.getElementById('horas').value);
            const energia = potencia * horas;
            document.getElementById('energiaSolar').innerText = energia;
        }
    </script>
</body>
</html>
